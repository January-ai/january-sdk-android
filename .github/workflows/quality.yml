name: CI

on:
  pull_request:
  push:
    branches:
      - main
  # Nightly on main: the full fixture suite, plus the live suite when the
  # JANUARY_API_KEY secret is set. A manual run does the same on any branch.
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # The event is part of the group so a push to main never cancels the nightly
  # run, or the other way round.
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MAESTRO_VERSION: '2.7.0'
  MAESTRO_SHA256: 'a4ccab6b604617e7aef6db4f885666056eabe5cfa32befaa3bc994041b8fcbb5'

# Job timeouts are the slowest successful run in recent history plus about 30%,
# so a hung emulator or build fails in minutes instead of running for hours.

jobs:
  # A pull request that changes only documentation skips the SDK build, the
  # demo build and the UI shards. Any other change, and every push, scheduled or
  # manual run, runs everything.
  changes:
    name: Detect docs-only changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.classify.outputs.code }}

    steps:
      - name: Check out repository
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Classify the changed files
        id: classify
        env:
          EVENT: ${{ github.event_name }}
        run: |
          code=true
          if [[ "$EVENT" == pull_request ]]; then
            # The checkout is GitHub's merge of the pull request into its base,
            # so the diff against the first parent is what the pull request changes.
            files="$(git diff --name-only --no-renames HEAD^1 HEAD)"
            printf 'Changed files:\n%s\n' "$files"
            if [[ -n "$files" ]]; then
              code=false
              while IFS= read -r file; do
                case "$file" in
                  *.md | Documentation/* | docs/* | LICENSE | .github/ISSUE_TEMPLATE/*) ;;
                  *) code=true ;;
                esac
              done <<< "$files"
            fi
          fi
          if [[ "$code" == false ]]; then
            echo "::notice::Only documentation changed: the SDK build, the demo build and the UI shards are skipped."
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  checks:
    name: Check docs and UI test coverage
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate README and GitBook
        run: node scripts/check-documentation.mjs

      - name: Check that the UI suite exercises every test tag
        run: node scripts/ui-coverage.mjs

  # The APK the UI shards install, built on its own so the shards start as soon
  # as it exists instead of after the SDK tests, lint and instrumented suite.
  build-demo:
    name: Build demo app
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 7

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      # The build cache travels with the Gradle cache that main's runs save, so
      # unchanged modules are not recompiled.
      - name: Build the example app
        run: ./gradlew --no-daemon --build-cache :demo:assembleDebug

      - name: Upload the demo app for the UI suite
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-demo-app
          path: demo/build/outputs/apk/debug/demo-debug.apk
          if-no-files-found: error
          retention-days: 1

  test-and-build:
    name: Test SDK and build demo
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 16

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Enable hardware acceleration for Android UI tests
        run: |
          sudo chown "$USER":kvm /dev/kvm
          sudo chmod 0660 /dev/kvm

      - name: Test and build the SDK
        run: ./gradlew --no-daemon :sdk:testDebugUnitTest :sdk:lintDebug :sdk:assembleRelease

      - name: Build the example app
        run: ./gradlew --no-daemon :demo:lintDebug :demo:assembleDebug

      - name: Run complete demo UI suite
        run: |
          python3 qa/parity/fixture_server.py 18766 > "$RUNNER_TEMP/android-fixture.log" 2>&1 &
          fixture_pid=$!
          trap 'kill "$fixture_pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            curl --fail --silent http://127.0.0.1:18766/__reset >/dev/null && break
            if [[ "$attempt" == 20 ]]; then
              cat "$RUNNER_TEMP/android-fixture.log"
              exit 1
            fi
            sleep 0.25
          done
          ./gradlew --no-daemon :demo:pixel2api35DebugAndroidTest \
            -Pandroid.testInstrumentationRunnerArguments.fixtureOrigin=http://10.0.2.2:18766

  # The Maestro suite (demo/.maestro) runs the demo end to end against the
  # fixture server, split across emulators so each job stays short. Failed
  # flows are rerun once and named in a warning; Maestro's failure screenshots
  # and view hierarchies are uploaded with the JUnit report.
  ui-test-android:
    name: ui-test-android (shard ${{ matrix.shard }} of 4)
    needs: build-demo
    runs-on: ubuntu-latest
    timeout-minutes: 26

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Maestro
        run: |
          archive="$RUNNER_TEMP/maestro.zip"
          curl --fail --location --silent --show-error --retry 3 \
            "https://github.com/mobile-dev-inc/Maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip" \
            --output "$archive"
          echo "${MAESTRO_SHA256}  ${archive}" | shasum -a 256 --check
          unzip -q "$archive" -d "$RUNNER_TEMP/maestro"
          "$RUNNER_TEMP/maestro/maestro/bin/maestro" --version
          echo "$RUNNER_TEMP/maestro/maestro/bin" >> "$GITHUB_PATH"

      - name: Download the demo app
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: android-demo-app
          path: ${{ runner.temp }}/android-demo-app

      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android device suite
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -memory 4096
          script: .github/scripts/android-ui-suite.sh "$RUNNER_TEMP/android-demo-app/demo-debug.apk" ${{ matrix.shard }} 4

      - name: Upload Android UI artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: maestro-android-${{ matrix.shard }}
          path: |
            demo/.maestro/artifacts
            ${{ runner.temp }}/android-fixture.log

  # One check that summarizes every shard, so branch protection can require a
  # single stable name. It passes on a docs-only pull request, whose shards are
  # skipped on purpose.
  ui-tests:
    needs: [changes, ui-test-android]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every UI shard passed
        env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          RESULT: ${{ needs.ui-test-android.result }}
        run: |
          echo "changes=$CHANGES code=$CODE android=$RESULT"
          if [[ "$CHANGES" == success && "$CODE" == false && "$RESULT" == skipped ]]; then
            echo "Only documentation changed, so the UI shards were skipped."
            exit 0
          fi
          test "$RESULT" = "success"

  live-gate:
    name: Check for the live API key
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      enabled: ${{ steps.key.outputs.enabled }}

    steps:
      - name: Look for the JANUARY_API_KEY secret
        id: key
        env:
          KEY_SET: ${{ secrets.JANUARY_API_KEY != '' }}
        run: |
          echo "enabled=$KEY_SET" >> "$GITHUB_OUTPUT"
          if [[ "$KEY_SET" != true ]]; then
            echo "::notice::The JANUARY_API_KEY repository secret is not set, so the live suite is skipped."
          fi

  # The live flows (tagged `live`) against the January API, through the token
  # relay running on this runner. The API key reaches only the relay's process.
  ui-test-android-live:
    name: ui-test-android (live)
    needs: live-gate
    if: needs.live-gate.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # The test end user the live flows sign in as. The weight flow's entries
      # stay on the account, so keep this a dedicated test user.
      LIVE_END_USER: ${{ vars.JANUARY_LIVE_END_USER || 'ci-nightly-android' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out the token relay
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: January-ai/january-token-relay
          ref: 65aa6dfc96e4ad0092e48130bba6fc5c3acea648
          path: token-relay
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      # 10.0.2.2 is how the emulator reaches the relay on this runner.
      - name: Build the example app against the token relay
        run: >-
          ./gradlew --no-daemon :demo:assembleDebug
          -PjanuaryPartnerTokenUrl=http://10.0.2.2:8787/api/january/client-token

      - name: Start the token relay
        working-directory: token-relay
        env:
          JANUARY_API_KEY: ${{ secrets.JANUARY_API_KEY }}
        run: |
          # The relay's own output names part of the key, so it goes to a file
          # and is shown only with the key removed.
          nohup node server.js > "$RUNNER_TEMP/token-relay.log" 2>&1 &
          relay_pid=$!
          for _ in $(seq 1 60); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:8787/; then
              echo "The token relay is running."
              exit 0
            fi
            kill -0 "$relay_pid" 2>/dev/null || break
            sleep 1
          done
          echo "The token relay did not start:"
          sed -E 's/sk-[^[:space:]]*/sk-[redacted]/g' "$RUNNER_TEMP/token-relay.log"
          exit 1

      - name: Install Maestro
        run: |
          archive="$RUNNER_TEMP/maestro.zip"
          curl --fail --location --silent --show-error --retry 3 \
            "https://github.com/mobile-dev-inc/Maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip" \
            --output "$archive"
          echo "${MAESTRO_SHA256}  ${archive}" | shasum -a 256 --check
          unzip -q "$archive" -d "$RUNNER_TEMP/maestro"
          "$RUNNER_TEMP/maestro/maestro/bin/maestro" --version
          echo "$RUNNER_TEMP/maestro/maestro/bin" >> "$GITHUB_PATH"

      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # run-live.mjs runs one flow at a time, checks each against the API, and
      # stops cleanly when the API reports a rate limit.
      - name: Run the live suite
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -memory 4096
          script: |
            adb install -r demo/build/outputs/apk/debug/demo-debug.apk
            node demo/.maestro/run-live.mjs --device emulator-5554 --end-user "$LIVE_END_USER"

      # Live screenshots show real API data, so they are kept only to debug a
      # failure, and briefly.
      - name: Add the relay's log, without the key, to the live results
        if: failure()
        run: |
          mkdir -p demo/.maestro/artifacts/live
          sed -E 's/sk-[^[:space:]]*/sk-[redacted]/g' "$RUNNER_TEMP/token-relay.log" > demo/.maestro/artifacts/live/token-relay.log || true

      - name: Upload the live run's results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: maestro-android-live
          path: demo/.maestro/artifacts/live
          retention-days: 7
