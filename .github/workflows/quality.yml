name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  MAESTRO_VERSION: '2.7.0'
  MAESTRO_SHA256: 'a4ccab6b604617e7aef6db4f885666056eabe5cfa32befaa3bc994041b8fcbb5'

jobs:
  test-and-build:
    name: Test SDK and build demo
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Enable hardware acceleration for Android UI tests
        run: |
          sudo chown "$USER":kvm /dev/kvm
          sudo chmod 0660 /dev/kvm

      - name: Validate README and GitBook
        run: node scripts/check-documentation.mjs

      - name: Check that the UI suite exercises every test tag
        run: node scripts/ui-coverage.mjs

      - name: Test and build the SDK
        run: ./gradlew --no-daemon :sdk:testDebugUnitTest :sdk:lintDebug :sdk:assembleRelease

      - name: Build the example app
        run: ./gradlew --no-daemon :demo:lintDebug :demo:assembleDebug

      - name: Run complete demo UI suite
        run: |
          python3 qa/parity/fixture_server.py 18766 > "$RUNNER_TEMP/android-fixture.log" 2>&1 &
          fixture_pid=$!
          trap 'kill "$fixture_pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            curl --fail --silent http://127.0.0.1:18766/__reset >/dev/null && break
            if [[ "$attempt" == 20 ]]; then
              cat "$RUNNER_TEMP/android-fixture.log"
              exit 1
            fi
            sleep 0.25
          done
          ./gradlew --no-daemon :demo:pixel2api35DebugAndroidTest \
            -Pandroid.testInstrumentationRunnerArguments.fixtureOrigin=http://10.0.2.2:18766

      - name: Upload the demo app for the UI suite
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-demo-app
          path: demo/build/outputs/apk/debug/demo-debug.apk
          if-no-files-found: error
          retention-days: 1

  # The Maestro suite (demo/.maestro) runs the demo end to end against the
  # fixture server, split across emulators so each job stays short. Failed
  # flows are rerun once and named in a warning; Maestro's failure screenshots
  # and view hierarchies are uploaded with the JUnit report.
  ui-test-android:
    name: ui-test-android (shard ${{ matrix.shard }} of 4)
    needs: test-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Maestro
        run: |
          archive="$RUNNER_TEMP/maestro.zip"
          curl --fail --location --silent --show-error --retry 3 \
            "https://github.com/mobile-dev-inc/Maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip" \
            --output "$archive"
          echo "${MAESTRO_SHA256}  ${archive}" | shasum -a 256 --check
          unzip -q "$archive" -d "$RUNNER_TEMP/maestro"
          "$RUNNER_TEMP/maestro/maestro/bin/maestro" --version
          echo "$RUNNER_TEMP/maestro/maestro/bin" >> "$GITHUB_PATH"

      - name: Download the demo app
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: android-demo-app
          path: ${{ runner.temp }}/android-demo-app

      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android device suite
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -memory 4096
          script: .github/scripts/android-ui-suite.sh "$RUNNER_TEMP/android-demo-app/demo-debug.apk" ${{ matrix.shard }} 4

      - name: Upload Android UI artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: maestro-android-${{ matrix.shard }}
          path: |
            demo/.maestro/artifacts
            ${{ runner.temp }}/android-fixture.log

  # One check that summarizes every shard, so branch protection can require a
  # single stable name.
  ui-tests:
    needs: ui-test-android
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every UI shard passed
        env:
          RESULT: ${{ needs.ui-test-android.result }}
        run: |
          echo "android=$RESULT"
          test "$RESULT" = "success"
