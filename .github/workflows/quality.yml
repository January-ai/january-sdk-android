name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test SDK and build demo
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.0.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Enable hardware acceleration for Android UI tests
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Validate README and GitBook
        run: node scripts/check-documentation.mjs

      - name: Test and build the SDK
        run: ./gradlew --no-daemon :sdk:testDebugUnitTest :sdk:lintDebug :sdk:assembleRelease

      - name: Build the example app
        run: ./gradlew --no-daemon :demo:lintDebug :demo:assembleDebug

      - name: Run complete demo UI suite
        run: ./gradlew --no-daemon :demo:pixel2api35DebugAndroidTest
