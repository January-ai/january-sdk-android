appId: ai.january.partner.demo
# Where the app reaches the fixture server: http://10.0.2.2:18766 (the
# emulator's alias for the host) unless the run passes -e FIXTURE_ORIGIN=...
# The default lives in the launch expression below rather than an `env:` block,
# because a subflow's own env replaces the value passed on the command line.
# The scripts under scripts/ reach the same server's control endpoints from the
# host at FIXTURE_CONTROL (default http://127.0.0.1:18766).
---
# Every flow starts here: reset the fixture server, then launch the demo in
# fixture mode (a debug-only intent extra, see MainActivity) and wait for the
# search screen.
- runScript:
    file: scripts/reset-fixture.js
- retry:
    maxRetries: 2
    commands:
      # Kill a previous flow's app before anything else talks to the device;
      # a hung app has stalled the next launch on hosted emulators.
      - stopApp
      - launchApp:
          clearState: false
          stopApp: true
          arguments:
            januaryFixtureOrigin: "${typeof FIXTURE_ORIGIN === 'undefined' ? 'http://10.0.2.2:18766' : FIXTURE_ORIGIN}"
      # A freshly booted hosted emulator sometimes shows a "<launcher> isn't
      # responding" dialog over the app.
      - tapOn:
          text: "Close app"
          optional: true
      - extendedWaitUntil:
          visible:
            id: search-screen
          timeout: 120000
