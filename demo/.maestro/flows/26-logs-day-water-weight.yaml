appId: ai.january.partner.demo
name: Logs day view - water total and weight, previous day is empty
tags:
  - fixture
---
- runFlow: ../bootstrap.yaml
- extendedWaitUntil:
    visible:
      id: tab-food-logs
    timeout: 15000
- runScript:
    file: ../scripts/seed-fixture.js
- tapOn:
    id: tab-food-logs
- assertVisible:
    id: food-logs-screen
- assertVisible: Today
- scrollUntilVisible:
    element:
      id: food-logs-totals
    direction: DOWN
    timeout: 30000
# The seeded log is dated an hour ago, so today's totals count it.
- assertVisible: 1 log
- scrollUntilVisible:
    element:
      id: water-empty
    direction: DOWN
    timeout: 15000
- runFlow:
    file: ../scroll-to.yaml
    env:
      TARGET_ID: water-log
- tapOn:
    id: water-log
- extendedWaitUntil:
    visible:
      id: water-logged
    timeout: 15000
- assertVisible: Logged 8 fl oz
- extendedWaitUntil:
    visible:
      id: water-total
    timeout: 15000
- assertVisible: 8 fl oz
- takeScreenshot: demo/.maestro/artifacts/android-logs-day-water
- runFlow:
    file: ../scroll-to.yaml
    env:
      TARGET_ID: water-unit-ml
- tapOn:
    id: water-unit-ml
- extendedWaitUntil:
    visible:
      text: 236.6 ml
    timeout: 15000
- runFlow:
    file: ../scroll-to.yaml
    env:
      TARGET_ID: water-delete-last
- tapOn:
    id: water-delete-last
- extendedWaitUntil:
    visible:
      id: water-empty
    timeout: 15000
- runFlow:
    file: ../scroll-to.yaml
    env:
      TARGET_ID: weight-unit-kg
- tapOn:
    id: weight-unit-kg
- tapOn:
    id: weight-value
- eraseText
- inputText: "70.5"
- pressKey: Enter
- runFlow:
    file: ../scroll-to.yaml
    env:
      TARGET_ID: weight-log
- tapOn:
    id: weight-log
- extendedWaitUntil:
    visible:
      id: weight-logged
    timeout: 15000
- assertVisible: Logged 70.5 kg
- extendedWaitUntil:
    visible:
      id: weight-day
    timeout: 15000
- assertVisible: 70.5 kg
- takeScreenshot: demo/.maestro/artifacts/android-logs-day-weight
# The previous day has nothing: no food logs, no water, no weight.
- scrollUntilVisible:
    element:
      id: logs-day-previous
    direction: UP
- tapOn:
    id: logs-day-previous
- assertVisible:
    id: logs-day-today
- extendedWaitUntil:
    visible:
      id: food-logs-empty
    timeout: 15000
- scrollUntilVisible:
    element:
      id: weight-empty
    direction: DOWN
    timeout: 15000
- assertVisible:
    id: water-empty
- scrollUntilVisible:
    element:
      id: logs-day-today
    direction: UP
- tapOn:
    id: logs-day-today
- assertVisible: Today
- scrollUntilVisible:
    element:
      id: food-log-0
    direction: DOWN
    timeout: 15000
