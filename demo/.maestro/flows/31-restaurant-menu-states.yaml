appId: ai.january.partner.demo
name: Restaurant menu - loading, error with details and retry, menu item glucose, empty menu
tags:
  - fixture
---
- runFlow: ../bootstrap.yaml
- extendedWaitUntil:
    visible:
      id: search-scope-restaurants
    timeout: 15000
- tapOn:
    id: search-scope-restaurants
- tapOn:
    id: restaurant-search-input
- inputText: Fixture Cafe
- pressKey: Enter
- extendedWaitUntil:
    visible:
      id: restaurant-result-0
    timeout: 15000
# A slow menu shows its loading state, then the items.
- runScript:
    file: ../scripts/control-fixture.js
    env:
      ROUTE: /v1.2/restaurants/cafe/menu-items
      DELAY: "6"
- tapOn:
    id: restaurant-result-0
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible:
      id: menu-loading
    timeout: 5000
- extendedWaitUntil:
    visible:
      id: restaurant-menu-item-0
    timeout: 15000
- tapOn:
    id: restaurant-detail-back
# A failed menu explains itself, discloses the technical details, and retries.
- runScript:
    file: ../scripts/control-fixture.js
    env:
      ROUTE: /v1.2/restaurants/cafe/menu-items
      STATUS: "500"
- extendedWaitUntil:
    visible:
      id: restaurant-result-0
    timeout: 15000
- tapOn:
    id: restaurant-result-0
- extendedWaitUntil:
    visible:
      id: menu-error
    timeout: 15000
- runFlow:
    file: ../scroll-to.yaml
    env:
      TARGET_ID: menu-error-details
- tapOn:
    id: menu-error-details
- runFlow:
    file: ../scroll-to.yaml
    env:
      TARGET_ID: menu-error-details-body
- assertVisible: "500"
- runScript:
    file: ../scripts/control-fixture.js
    env:
      ROUTE: /v1.2/restaurants/cafe/menu-items
- runFlow:
    file: ../scroll-to.yaml
    env:
      TARGET_ID: menu-error-retry
- tapOn:
    id: menu-error-retry
- extendedWaitUntil:
    visible:
      id: restaurant-menu-item-0
    timeout: 15000
- assertNotVisible:
    id: menu-error
# A menu item: pick a serving, then its glucose impact.
- tapOn:
    id: restaurant-menu-item-0
- extendedWaitUntil:
    visible:
      id: menu-item-detail-screen
    timeout: 15000
- runFlow:
    file: ../scroll-to.yaml
    env:
      TARGET_ID: food-serving-unit
- tapOn:
    id: food-serving-unit
- tapOn:
    id: food-serving-option-1
- assertVisible: "oz · 28.35 g"
- runFlow:
    file: ../scroll-to.yaml
    env:
      TARGET_ID: menu-glucose-button
- tapOn:
    id: menu-glucose-button
- extendedWaitUntil:
    visible:
      id: food-glucose-result
    timeout: 15000
- tapOn: Close Glucose response
- tapOn:
    id: menu-item-detail-back
- extendedWaitUntil:
    visible:
      id: restaurant-detail-screen
    timeout: 15000
- tapOn:
    id: restaurant-detail-back
# A restaurant with no menu items.
- runScript:
    file: ../scripts/control-fixture.js
    env:
      ROUTE: /v1.2/restaurants/cafe/menu-items
      EMPTY: "true"
- extendedWaitUntil:
    visible:
      id: restaurant-result-0
    timeout: 15000
- tapOn:
    id: restaurant-result-0
- extendedWaitUntil:
    visible:
      id: menu-empty
    timeout: 15000
- assertVisible: No menu items found
- tapOn:
    id: restaurant-detail-back
- extendedWaitUntil:
    visible:
      id: restaurant-search-screen
    timeout: 15000
