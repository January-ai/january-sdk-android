appId: ai.january.partner.demo
name: Every primary destination is reachable
tags:
  - fixture
---
- runFlow: ../bootstrap.yaml
- extendedWaitUntil:
    visible:
      id: tab-scan
    timeout: 15000
- tapOn:
    id: tab-scan
- assertVisible:
    id: scan-screen
- assertVisible: Scan a meal
- tapOn:
    id: tab-tracking
- assertVisible:
    id: tracking-screen
- assertVisible: Track one day at a time
- runFlow:
    file: ../scroll-to.yaml
    env:
      TARGET_ID: logs-day-label
- assertVisible: Today
- tapOn:
    id: tab-food-logs
- assertVisible:
    id: food-logs-screen
- assertVisible: Build one complete meal
- tapOn:
    id: tab-glucose
- assertVisible:
    id: glucose-screen
- assertVisible: Estimate this meal.s response
- tapOn:
    id: tab-search
- assertVisible:
    id: search-screen
