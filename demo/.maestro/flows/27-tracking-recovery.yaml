appId: ai.january.partner.demo
name: Tracking day view - water and weight failures and retry
tags:
  - fixture
---
- runFlow: ../bootstrap.yaml
- extendedWaitUntil:
    visible:
      id: tab-tracking
    timeout: 15000
- runScript:
    file: ../scripts/control-fixture.js
    env:
      ROUTE: /v1.2/water-logs
      STATUS: "400"
- tapOn:
    id: tab-tracking
- scrollUntilVisible:
    element:
      id: water-error
    direction: DOWN
    timeout: 15000
- assertVisible: Check the information you entered
- takeScreenshot: demo/.maestro/artifacts/android-tracking-water-error
- runFlow:
    file: ../scroll-to.yaml
    env:
      TARGET_ID: water-error-details
- tapOn:
    id: water-error-details
- runFlow:
    file: ../scroll-to.yaml
    env:
      TARGET_ID: water-error-details-body
- assertVisible: "400"
- runScript:
    file: ../scripts/control-fixture.js
    env:
      ROUTE: /v1.2/water-logs
      STATUS: "200"
- runFlow:
    file: ../scroll-to.yaml
    env:
      TARGET_ID: water-retry
- tapOn:
    id: water-retry
# The day's total sits at the top of the water card, above the retry button.
- scrollUntilVisible:
    element:
      id: water-empty
    direction: UP
    timeout: 15000
- assertNotVisible:
    id: water-error
# The water chart failed with the same request and retries on its own.
- runFlow:
    file: ../scroll-to.yaml
    env:
      TARGET_ID: water-chart-retry
- tapOn:
    id: water-chart-retry
- scrollUntilVisible:
    element:
      id: water-chart-empty
    direction: UP
    timeout: 15000
- assertNotVisible:
    id: water-chart-error
- runScript:
    file: ../scripts/control-fixture.js
    env:
      ROUTE: /v1.2/weight-logs
      STATUS: "500"
- runFlow:
    file: ../scroll-to.yaml
    env:
      TARGET_ID: weight-log
- tapOn:
    id: weight-log
- scrollUntilVisible:
    element:
      id: weight-error
    direction: DOWN
    timeout: 15000
- runFlow:
    file: ../scroll-to.yaml
    env:
      TARGET_ID: weight-error-details
- tapOn:
    id: weight-error-details
- runFlow:
    file: ../scroll-to.yaml
    env:
      TARGET_ID: weight-error-details-body
- assertVisible: "500"
- runScript:
    file: ../scripts/control-fixture.js
    env:
      ROUTE: /v1.2/weight-logs
      STATUS: "200"
# "Try again" repeats the failed save, not just a reload of the day.
- runFlow:
    file: ../scroll-to.yaml
    env:
      TARGET_ID: weight-retry
- tapOn:
    id: weight-retry
- scrollUntilVisible:
    element:
      id: weight-logged
    direction: UP
    timeout: 15000
- assertVisible: Logged 150 lb
- assertNotVisible:
    id: weight-error
