appId: ai.january.partner.demo
name: Tracking day view - water and weight failures and retry
tags:
  - fixture
---
- runFlow: ../bootstrap.yaml
- extendedWaitUntil:
    visible:
      id: tab-tracking
    timeout: 15000
- runScript:
    file: ../scripts/control-fixture.js
    env:
      ROUTE: /v1.2/water-logs
      STATUS: "400"
- tapOn:
    id: tab-tracking
- scrollUntilVisible:
    element:
      id: water-error
    direction: DOWN
    timeout: 15000
- assertVisible: Check the information you entered
- takeScreenshot: demo/.maestro/artifacts/android-tracking-water-error
- runFlow:
    file: ../scroll-to.yaml
    env:
      TARGET_ID: water-error-details
- tapOn:
    id: water-error-details
- runFlow:
    file: ../scroll-to.yaml
    env:
      TARGET_ID: water-error-details-body
- assertVisible: "400"
- runScript:
    file: ../scripts/control-fixture.js
    env:
      ROUTE: /v1.2/water-logs
      STATUS: "200"
- runFlow:
    file: ../scroll-to.yaml
    env:
      TARGET_ID: water-retry
- tapOn:
    id: water-retry
# The day's total sits at the top of the water card, above the retry button.
- scrollUntilVisible:
    element:
      id: water-empty
    direction: UP
    timeout: 15000
- assertNotVisible:
    id: water-error
# The water chart failed with the same request and retries on its own.
- runFlow:
    file: ../scroll-to.yaml
    env:
      TARGET_ID: water-chart-retry
- tapOn:
    id: water-chart-retry
- scrollUntilVisible:
    element:
      id: water-chart-empty
    direction: UP
    timeout: 15000
- assertNotVisible:
    id: water-chart-error
# A server error on a save may come after the weight was saved, and the create is
# not idempotent: "Try again" reloads the day instead of logging it twice.
- runScript:
    file: ../scripts/control-fixture.js
    env:
      ROUTE: /v1.2/weight-logs
      STATUS: "500"
- runFlow:
    file: ../scroll-to.yaml
    env:
      TARGET_ID: weight-log
- tapOn:
    id: weight-log
- scrollUntilVisible:
    element:
      id: weight-error
    direction: DOWN
    timeout: 15000
- scrollUntilVisible:
    element:
      text: "The weight may have been saved anyway.*"
    direction: DOWN
    timeout: 15000
- runFlow:
    file: ../scroll-to.yaml
    env:
      TARGET_ID: weight-error-details
- tapOn:
    id: weight-error-details
- runFlow:
    file: ../scroll-to.yaml
    env:
      TARGET_ID: weight-error-details-body
- assertVisible: "500"
- runScript:
    file: ../scripts/control-fixture.js
    env:
      ROUTE: /v1.2/weight-logs
      STATUS: "200"
- runFlow:
    file: ../scroll-to.yaml
    env:
      TARGET_ID: weight-retry
- tapOn:
    id: weight-retry
- scrollUntilVisible:
    element:
      id: weight-empty
    direction: UP
    timeout: 15000
- assertNotVisible:
    id: weight-error
- assertNotVisible:
    id: weight-logged
- runScript:
    file: ../scripts/assert-request.js
    env:
      ROUTE: /v1.2/weight-logs
      FIELD: method
      VALUE: '"GET"'
# A save the API refused was not recorded: "Try again" sends it again.
- runScript:
    file: ../scripts/control-fixture.js
    env:
      ROUTE: /v1.2/weight-logs
      STATUS: "429"
- runFlow:
    file: ../scroll-to.yaml
    env:
      TARGET_ID: weight-log
- tapOn:
    id: weight-log
- scrollUntilVisible:
    element:
      id: weight-error
    direction: DOWN
    timeout: 15000
- assertVisible: Too many requests
- assertNotVisible: "The weight may have been saved anyway.*"
- runScript:
    file: ../scripts/control-fixture.js
    env:
      ROUTE: /v1.2/weight-logs
      STATUS: "200"
- runFlow:
    file: ../scroll-to.yaml
    env:
      TARGET_ID: weight-retry
- tapOn:
    id: weight-retry
- scrollUntilVisible:
    element:
      id: weight-logged
    direction: UP
    timeout: 15000
- assertVisible: Logged 150 lb
- assertNotVisible:
    id: weight-error
- runScript:
    file: ../scripts/assert-request.js
    env:
      ROUTE: /v1.2/weight-logs
      METHOD: POST
      FIELD: body.weight.value
      VALUE: "150"
# The same holds for water: after a server error, "Try again" only reloads the day.
- runScript:
    file: ../scripts/control-fixture.js
    env:
      ROUTE: /v1.2/water-logs
      STATUS: "503"
- scrollUntilVisible:
    element:
      id: water-log
    direction: UP
    centerElement: true
    timeout: 15000
- tapOn:
    id: water-log
- scrollUntilVisible:
    element:
      text: "The water may have been saved anyway.*"
    direction: DOWN
    timeout: 15000
- runScript:
    file: ../scripts/control-fixture.js
    env:
      ROUTE: /v1.2/water-logs
      STATUS: "200"
- runFlow:
    file: ../scroll-to.yaml
    env:
      TARGET_ID: water-retry
- tapOn:
    id: water-retry
- scrollUntilVisible:
    element:
      id: water-empty
    direction: UP
    timeout: 15000
- assertNotVisible:
    id: water-error
- runScript:
    file: ../scripts/assert-request.js
    env:
      ROUTE: /v1.2/water-logs
      FIELD: method
      VALUE: '"GET"'
