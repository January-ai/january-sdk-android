appId: ai.january.partner.demo
name: Native parity - food log surfaces
tags:
  - parity
---
- runFlow: ../bootstrap.yaml
- extendedWaitUntil:
    visible:
      id: tab-food-logs
    timeout: 15000
- runScript:
    file: ../scripts/seed-fixture.js
- tapOn:
    id: tab-food-logs
- assertVisible:
    id: food-log-user-card
- takeScreenshot: demo/.maestro/artifacts/android-logs-initial
- scrollUntilVisible:
    element:
      id: logs-range-month
    direction: DOWN
- tapOn:
    id: logs-range-month
- extendedWaitUntil:
    visible:
      id: food-log-0
    timeout: 15000
- scrollUntilVisible:
    element:
      id: food-logs-refresh
    direction: UP
- tapOn:
    id: food-logs-refresh
- extendedWaitUntil:
    visible:
      id: food-log-0
    timeout: 15000
- takeScreenshot: demo/.maestro/artifacts/android-logs-list
- tapOn:
    id: food-log-0
- assertVisible:
    id: food-log-detail
- takeScreenshot: demo/.maestro/artifacts/android-log-detail
- tapOn:
    id: food-log-edit
- assertVisible: Edit food log
- takeScreenshot: demo/.maestro/artifacts/android-log-editor
