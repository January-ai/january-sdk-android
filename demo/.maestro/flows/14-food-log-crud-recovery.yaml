appId: ai.january.partner.demo
name: Food log update delete and retry preserve state
tags:
  - fixture
  - recovery
---
- runFlow: ../bootstrap.yaml
- extendedWaitUntil:
    visible:
      id: tab-food-logs
    timeout: 15000
- runScript:
    file: ../scripts/seed-fixture.js
- tapOn:
    id: tab-food-logs
- scrollUntilVisible:
    element:
      id: food-log-0
    direction: DOWN
    timeout: 30000
- tapOn:
    id: food-log-0
- assertVisible:
    id: food-log-detail
- tapOn:
    id: food-log-edit
- assertVisible: Edit food log
- tapOn:
    id: food-log-name
- eraseText: 30
- inputText: Updated meal
- pressKey: Enter
- scrollUntilVisible:
    element:
      id: food-log-save
    direction: DOWN
- tapOn:
    id: food-log-save
# Saving returns to the top of the list screen; reopen the log to reach its detail.
- scrollUntilVisible:
    element:
      id: food-log-0
    direction: DOWN
    timeout: 30000
- tapOn:
    id: food-log-0
- extendedWaitUntil:
    visible:
      id: food-log-detail
    timeout: 15000
- runScript:
    file: ../scripts/control-fixture.js
    env:
      ROUTE: /v1.2/food-logs/11111111-1111-4111-8111-111111111111
      STATUS: "500"
- runFlow:
    file: ../scroll-to.yaml
    env:
      TARGET_ID: food-log-delete
- tapOn:
    id: food-log-delete
- assertVisible: Delete this food log?
- takeScreenshot: demo/.maestro/artifacts/android-log-delete-confirmation
- tapOn:
    id: confirm-delete-food-log
- extendedWaitUntil:
    visible:
      id: food-logs-error
    timeout: 15000
- takeScreenshot: demo/.maestro/artifacts/android-log-delete-error
- runScript:
    file: ../scripts/control-fixture.js
    env:
      ROUTE: /v1.2/food-logs/11111111-1111-4111-8111-111111111111
      STATUS: "200"
- runFlow:
    file: ../scroll-to.yaml
    env:
      TARGET_ID: food-logs-retry
- tapOn:
    id: food-logs-retry
- scrollUntilVisible:
    element:
      id: food-logs-empty
    direction: DOWN
    timeout: 30000
- assertNotVisible:
    id: food-logs-error
