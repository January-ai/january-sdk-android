appId: ai.january.partner.demo
name: Live - water and weight charts by week, month and year match the API
tags:
  - live
---
- runFlow: ../live-bootstrap.yaml
- runFlow: ../live-tracking-context.yaml
# Water in ml, each range summarized as the API's daily totals say.
- runFlow:
    file: ../scroll-to.yaml
    env:
      TARGET_ID: water-unit-ml
- tapOn:
    id: water-unit-ml
- runFlow:
    file: ../scroll-to.yaml
    env:
      TARGET_ID: water-chart-range-week
- tapOn:
    id: water-chart-range-week
- runScript:
    file: ../scripts/live-verify.js
    env:
      CHECK: water-chart
      RANGE: week
      UNIT: ml
- scrollUntilVisible:
    element:
      text: ${output.expectedChart}
    direction: DOWN
    timeout: 30000
- takeScreenshot: "${typeof SHOTS === 'undefined' ? 'demo/.maestro/artifacts/live' : SHOTS}/android-live-50-water-week"
- runFlow:
    file: ../scroll-to.yaml
