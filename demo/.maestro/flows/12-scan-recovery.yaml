appId: ai.january.partner.demo
name: Scan and correction failures recover without losing input
tags:
  - fixture
  - recovery
---
- runFlow: ../bootstrap.yaml
- extendedWaitUntil:
    visible:
      id: tab-scan
    timeout: 15000
- runScript:
    file: ../scripts/control-fixture.js
    env:
      ROUTE: /v1.2/food-analysis/image
      STATUS: "500"
- tapOn:
    id: tab-scan
- tapOn:
    id: scan-sample
- assertVisible:
    id: scan-preview
- tapOn:
    id: scan-analyze
- extendedWaitUntil:
    visible:
      id: scan-error
    timeout: 15000
- runFlow:
    file: ../scroll-to.yaml
    env:
      TARGET_ID: scan-error-details
- tapOn:
    id: scan-error-details
- runFlow:
    file: ../scroll-to.yaml
    env:
      TARGET_ID: scan-error-details-body
- assertVisible: parity-request
- runScript:
    file: ../scripts/control-fixture.js
    env:
      ROUTE: /v1.2/food-analysis/image
      STATUS: "200"
- runFlow:
    file: ../scroll-to.yaml
    env:
      TARGET_ID: scan-error-retry
- tapOn:
    id: scan-error-retry
- extendedWaitUntil:
    visible:
      id: scan-results
    timeout: 15000
- assertVisible: Fixture breakfast
- runScript:
    file: ../scripts/control-fixture.js
    env:
      ROUTE: /v1.2/food-analysis/corrections
      STATUS: "500"
- scrollUntilVisible:
    element:
      id: scan-correct
    direction: DOWN
- tapOn:
    id: scan-correct
- tapOn:
    id: scan-correction-input
- inputText: retry correction
# The instruction is multi-line, so Enter adds a line; Done on the meal name
# closes the keyboard instead.
- tapOn:
    id: correction-meal-name
- pressKey: Enter
- scrollUntilVisible:
    element:
      id: scan-correction-submit
    direction: DOWN
- tapOn:
    id: scan-correction-submit
- extendedWaitUntil:
    visible:
      id: scan-correction-error
    timeout: 15000
- assertVisible: retry correction
- runFlow:
    file: ../scroll-to.yaml
    env:
      TARGET_ID: scan-correction-error-details
- tapOn:
    id: scan-correction-error-details
- runFlow:
    file: ../scroll-to.yaml
    env:
      TARGET_ID: scan-correction-error-details-body
- assertVisible: parity-request
- runScript:
    file: ../scripts/control-fixture.js
    env:
      ROUTE: /v1.2/food-analysis/corrections
      STATUS: "200"
- runFlow:
    file: ../scroll-to.yaml
    env:
      TARGET_ID: scan-correction-error-retry
- tapOn:
    id: scan-correction-error-retry
# The corrected meal name heads the sheet content, above the scroll position
# the correction button was tapped from.
- scrollUntilVisible:
    element:
      text: Corrected breakfast
    direction: UP
    timeout: 30000
- runFlow:
    file: ../scroll-to.yaml
    env:
      TARGET_ID: scan-another
- tapOn:
    id: scan-another
- assertVisible:
    id: scan-guide
- assertNotVisible:
    id: scan-results
